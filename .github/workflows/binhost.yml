# Monolith's binhost: binary packages of what a Monolith install on Gentoo needs that Gentoo's
# own binhost doesn't have, so an install never compiles (monolith/binhost/build.sh says how).
# Built in the official stage3 (desktop, systemd: what gentoo-install sets up) on the stable
# branch, for any x86-64 CPU; published as the assets of the `binhost` release, which Portage
# reads as a binhost: https://github.com/<repo>/releases/download/binhost
#
# Every Monday and when started by hand. One run has 6 hours: big builds can take more than one;
# each run publishes what it finished and the next one goes on from there.
name: binhost

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

concurrency:
  group: binhost
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /gentoo
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: The stage3
        run: |
          base=https://distfiles.gentoo.org/releases/amd64/autobuilds
          path=$(curl -fsL "$base/latest-stage3-amd64-desktop-systemd.txt" | grep -v '^#' | awk '{print $1; exit}')
          echo "stage3: $path"
          curl -fsL -o /tmp/stage3.tar.xz "$base/$path"
          sudo mkdir -p "$ROOT"
          sudo tar -xpf /tmp/stage3.tar.xz -C "$ROOT" --xattrs-include='*.*' --numeric-owner
          rm /tmp/stage3.tar.xz

      - name: What's published already
        run: |
          mkdir -p prev
          if gh release view binhost >/dev/null 2>&1; then
            gh release download binhost -D prev -p '*.gpkg.tar' || true
          fi
          ls prev | wc -l

      - name: Build
        env:
          # the binhost's signing key (gpg --armor --export-secret-keys); its public half is
          # monolith/binhost/monolith-binhost.asc
          BINHOST_GPG_KEY: ${{ secrets.BINHOST_GPG_KEY }}
        run: |
          sudo mkdir -p "$ROOT/monolith" "$ROOT/prev" "$ROOT/out" "$ROOT/root/.gnupg"
          sudo chmod 700 "$ROOT/root/.gnupg"
          FPR=""
          if [ -n "$BINHOST_GPG_KEY" ]; then
            # (imported inside, by the stage3's own gpg)
            printf '%s\n' "$BINHOST_GPG_KEY" | sudo install -m 600 /dev/stdin "$ROOT/root/bh-key.asc"
            FPR=$(cat monolith/binhost/monolith-binhost.fpr)
          fi
          sudo cp -r . "$ROOT/monolith/"
          sudo cp -r prev/. "$ROOT/prev/"
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"
          for d in proc sys dev; do sudo mount --rbind "/$d" "$ROOT/$d"; done
          sudo chroot "$ROOT" /usr/bin/env -i HOME=/root TERM=dumb PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MAKEOPTS="-j$(nproc)" BINHOST_SIGNING_FPR="$FPR" bash -c '
              [ -f /root/bh-key.asc ] && { gpg --homedir /root/.gnupg --batch --quiet --import /root/bh-key.asc; rm -f /root/bh-key.asc; }
              python3 /monolith/monolith/binhost/publish.py --unflatten /prev /var/cache/binpkgs
              bash /monolith/monolith/binhost/build.sh --minutes 290
              python3 /monolith/monolith/binhost/publish.py /var/cache/binpkgs /out'
          ls "$ROOT/out" | wc -l

      - name: Publish
        run: |
          gh release view binhost >/dev/null 2>&1 || gh release create binhost --latest=false \
            --title "Monolith binhost" \
            --notes "Binary packages for Monolith on Gentoo (stable, any x86-64 CPU): what Gentoo's own binhost doesn't have. The Monolith installer adds this as a binhost; not meant to be downloaded by hand. Built by .github/workflows/binhost.yml."
          gh release upload binhost "$ROOT"/out/* --clobber
          # what's no longer in the set
          keep=$(ls "$ROOT/out")
          for a in $(gh release view binhost --json assets -q '.assets[].name'); do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset binhost "$a" --yes
          done
