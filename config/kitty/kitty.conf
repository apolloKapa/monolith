# kitty config from Monolith. Installed only when you have no kitty.conf; updates never
# overwrite it, so change anything you like. Reload with ctrl+shift+F5.

font_family      JetBrains Mono
font_size        14.0
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_trail 1
confirm_os_window_close 0
scrollback_lines 10000
wheel_scroll_min_lines 1
enable_audio_bell no
hide_window_decorations yes
remember_window_size no
window_padding_width 4

# colours from your wallpaper (Monolith's matugen writes this file and reloads kitty)
include colors.conf
