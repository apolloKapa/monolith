# Monolith's binhost builder (binhost/build.sh): gentoo-install's make.conf on the stable branch,
# built for any x86-64 CPU (no -march=native), so its packages install on every machine that
# gentoo-install sets up. Keep in step with gentoo-install's USE and package.use.
COMMON_FLAGS="-march=x86-64 -mtune=generic -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
ACCEPT_KEYWORDS="amd64"
ACCEPT_LICENSE="*"
USE="wayland X pipewire pulseaudio screencast vulkan vaapi bluetooth networkmanager \
     dist-kernel systemd udisks policykit dbus zstd"
VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"
L10N="en en-US"
LC_MESSAGES=C.utf8
GENTOO_MIRRORS="https://distfiles.gentoo.org"
PKGDIR="/var/cache/binpkgs"
# every package built here is kept as a binary; the namespace sandboxes don't work in a chroot
FEATURES="buildpkg -ipc-sandbox -network-sandbox -pid-sandbox -mount-sandbox"
EMERGE_DEFAULT_OPTS="--with-bdeps=y --keep-going --binpkg-changed-deps=n --getbinpkg"
