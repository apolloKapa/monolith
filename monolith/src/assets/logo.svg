<?xml version="1.0" encoding="UTF-8"?>
<!-- Monolith mark: a 4:9 slab drawn as frame + core, standing on a horizon line.
     Only the alpha matters: the intro uses it as a mask for the liquid fill. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 270 270">
  <path fill="#ffffff" fill-rule="evenodd"
        d="M95 22 H175 V202 H95 Z
           M107 34 V190 H163 V34 Z"/>
  <rect x="119" y="46" width="32" height="132" fill="#ffffff"/>
  <rect x="40" y="218" width="190" height="12" fill="#ffffff"/>
  <rect x="80" y="240" width="110" height="8" fill="#ffffff"/>
</svg>
